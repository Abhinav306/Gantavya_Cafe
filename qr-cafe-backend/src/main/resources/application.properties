# H2 (development default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:qrcafe;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 Console
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Server
server.port=${PORT:8080}

# Staff & Admin Security PINs
cafe.admin.pin=${ADMIN_PIN:9988}
cafe.kitchen.pin=${KITCHEN_PIN:2244}
